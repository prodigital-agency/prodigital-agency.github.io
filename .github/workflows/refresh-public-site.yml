          footer = re.compile(r'^[ \t]*<div>ИП Анисимова Катерина Андреевна</div>\r?\n[ \t]*<div>ИНН \d{12} · ОГРН \d{15}</div>\r?\n', re.MULTILINE)
          operator = re.compile(r'<p><strong style="color:var\(--text\)">Оператор:</strong> ИП Анисимова Катерина Андреевна, ИНН \d{12}, ОГРН \d{15}\.</p>')
          new_operator = '<p>Оператор персональных данных — <strong style="color:var(--text)">IE Katerina Anisimova</strong> (Tax ID 306521387).</p>'
          old_details = re.compile(r'ИП\s+Анисимова|(?:ИНН|ОГРН(?:ИП)?)\s*\d{10,15}', re.IGNORECASE)

          def materialize(entry):
              path, expected = entry
              url = os.environ['SITE'] + quote(path)
              for attempt in range(3):
                  try:
                      with urlopen(url, timeout=45) as response:
                          data = response.read()
                      break
                  except OSError:
                      if attempt == 2:
                          raise RuntimeError(f'Cannot download {path}') from None
                      time.sleep(2)
              if path.endswith('.html'):
                  source = operator.sub(new_operator, footer.sub('', data.decode('utf-8')))
                  if old_details.search(source):
                      raise RuntimeError(f'Old business details in {path}')
                  data = source.encode('utf-8')
              actual = sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              if actual != expected:
                  raise RuntimeError(f'Public file does not match approved source: {path}')
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          with ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(materialize, manifest.items()))
          (root / '.nojekyll').touch()
          print(f'All {len(manifest)} files match the approved source.')
