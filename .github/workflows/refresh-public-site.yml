      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/prodigital-public
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the published HTML
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen
          import os
          import time

          root = Path('/tmp/prodigital-public')
          site = os.environ['SITE'].rstrip('/') + '/'
          pages = list(root.rglob('*.html'))

          def verified(page, attempt):
              route = page.relative_to(root).as_posix()
              if route.endswith('index.html'):
                  route = route[:-len('index.html')]
              url = site + quote(route) + '?verify=' + os.environ['GITHUB_RUN_ID'] + '-' + str(attempt)
              try:
                  with urlopen(url, timeout=20) as response:
                      return response.read() == page.read_bytes()
              except OSError:
                  return False

          pending = pages
          for attempt in range(5):
              with ThreadPoolExecutor(max_workers=6) as pool:
                  results = list(pool.map(lambda page: verified(page, attempt), pending))
              pending = [page for page, valid in zip(pending, results) if not valid]
              if not pending:
                  print(f'Verified {len(pages)} HTML files on the live website.')
                  break
              if attempt < 4:
                  time.sleep(12)
          if pending:
              raise SystemExit('Live content differs: ' + ', '.join(str(p.relative_to(root)) for p in pending))
          PY
