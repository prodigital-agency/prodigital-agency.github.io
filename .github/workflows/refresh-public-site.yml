name: Refresh public ProDigital release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-public-site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Materialize approved public website
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import json
          import os
          import time
          from concurrent.futures import ThreadPoolExecutor
          from hashlib import sha1, sha256
          from pathlib import Path, PurePosixPath
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          encoded = Path('.github/releases/20261122-home-cases-seo.b64').read_text().strip() + '\n'
          assert sha256(encoded.encode('ascii')).hexdigest() == 'c8d6c05cc86de2c0ecf3b26eeeafe56c10cecbfe2ed9b57950762f402b20c1c9', 'Release data checksum mismatch'
          release = json.loads(gzip.decompress(base64.b64decode(encoded)))
          assert release['schema'] == 1
          assert release['approved_commit'] == 'a7e6e67dc5879aabd8b6981b4cc951077639d966'
          manifest = release['files']
          assert len(manifest) == 173
          assert sum(p.endswith('.html') for p in manifest) == 41
          assert set(release['patch']).issubset(manifest)
          root = Path('/tmp/prodigital-public')
          root.mkdir(parents=True, exist_ok=True)
          site = 'https://prodigital-agency.github.io/'

          def materialize(item):
              path, expected = item
              parts = PurePosixPath(path).parts
              assert parts and '..' not in parts and not path.startswith('/')
              assert parts[0] not in {'previews', 'docs', 'tools', '.github', 'deployment'}
              if path in release['patch']:
                  data = base64.b64decode(release['patch'][path], validate=True)
              else:
                  for attempt in range(4):
                      try:
                          url = site + quote(path) + '?release=' + os.environ['GITHUB_RUN_ID'] + '-' + str(attempt)
                          with urlopen(Request(url, headers={'User-Agent': 'ProDigital-Publisher'}), timeout=30) as response:
                              data = response.read()
                          break
                      except OSError:
                          if attempt == 3:
                              raise
                          time.sleep(2)
              actual = sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              assert actual == expected, f'Public file does not match approved source: {path}'
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          with ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(materialize, manifest.items()))
          (root / '.nojekyll').touch()
          (root / 'release.json').write_text(json.dumps({
              'approved_commit': release['approved_commit'],
              'main_commit': 'c3ba243bd6cba636d71c0a1d74b35cefe7a8a70c',
              'files': manifest
          }, ensure_ascii=False, indent=2) + '\n')
          print(f'All {len(manifest)} files match the approved source.')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/prodigital-public
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published pages and shared assets
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen
          import os
          import time

          root = Path('/tmp/prodigital-public')
          site = os.environ['SITE'].rstrip('/') + '/'
          pages = list(root.rglob('*.html'))
          assets = [root / path for path in ('style.css', 'script.js', 'assets/case-content.js', 'assets/case-catalog.css', 'assets/service-navigation.css', 'career/style.css')]

          def verified(page, attempt):
              route = page.relative_to(root).as_posix()
              if route.endswith('index.html'):
                  route = route[:-len('index.html')]
              url = site + quote(route) + '?verify=' + os.environ['GITHUB_RUN_ID'] + '-' + str(attempt)
              try:
                  with urlopen(url, timeout=20) as response:
                      return response.read() == page.read_bytes()
              except OSError:
                  return False

          pending = pages + assets
          for attempt in range(5):
              with ThreadPoolExecutor(max_workers=6) as pool:
                  results = list(pool.map(lambda page: verified(page, attempt), pending))
              pending = [page for page, valid in zip(pending, results) if not valid]
              if not pending:
                  print(f'Verified {len(pages)} HTML pages and {len(assets)} shared assets on the live website.')
                  break
              if attempt < 4:
                  time.sleep(12)
          if pending:
              raise SystemExit('Live content differs: ' + ', '.join(str(p.relative_to(root)) for p in pending))
          PY
