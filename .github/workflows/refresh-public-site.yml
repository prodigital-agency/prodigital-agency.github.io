          with urlopen(archive_url, timeout=120) as response:
              package = response.read()
          root = Path('/tmp/prodigital-public')
          root.mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(package)) as archive:
              release = json.loads(archive.read('release.json'))
              assert release['approved_commit'] == 'aea42ac8be9648caf24676ce8bd1fe696eea05b9'
              assert release['files'] == expected, 'Release inventory differs from approved source'
              assert set(archive.namelist()) == set(expected) | {'.nojekyll', 'release.json'}, 'Unexpected archive entries'
              for path, expected_sha in expected.items():
                  raw = archive.read(path)
                  actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
                  assert actual == expected_sha, 'File differs: ' + path
                  target = root / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(raw)
          release['main_commit'] = '03d90a2d6b29dd196dd81bddbff89af214457eb9'
          (root / 'release.json').write_text(json.dumps(release, ensure_ascii=False, indent=2) + '\n')
          (root / '.nojekyll').touch()
          print('Verified', len(expected), 'approved public files.')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/prodigital-public
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify live pages
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.request import urlopen
          import os,time
          root = Path('/tmp/prodigital-public')
          site = os.environ['SITE'].rstrip('/') + '/'
          pages = list(root.rglob('*.html'))
          def matches(page, attempt):
              route = page.relative_to(root).as_posix()
              if route.endswith('index.html'): route = route[:-10]
              try:
                  with urlopen(site+route+'?release='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt), timeout=20) as response:
                      return response.read() == page.read_bytes()
              except OSError: return False
          pending = pages
          for attempt in range(5):
              with ThreadPoolExecutor(max_workers=6) as pool:
                  valid = list(pool.map(lambda p: matches(p, attempt), pending))
              pending = [p for p, ok in zip(pending, valid) if not ok]
              if not pending: break
              time.sleep(12)
          assert not pending, [str(p.relative_to(root)) for p in pending]
          print('Verified', len(pages), 'live HTML pages.')
          PY
